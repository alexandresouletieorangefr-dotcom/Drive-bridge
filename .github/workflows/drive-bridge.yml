
name: Drive Bridge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (vide = auto, ex. assets-20261022-1600)'
        required: false
        default: ''
  schedule:
    # toutes les 2 h, décalage pour éviter les pointes
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: drive-bridge
  cancel-in-progress: false

jobs:
  mirror:
    name: Miroir Drive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GDRIVE_HOME: /home/runner/.gdrive-bridge
      BRIDGE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restaurer le cache des assets
        uses: actions/cache/restore@v4
        with:
          path: assets
          key: assets-${{ github.run_id }}
          restore-keys: |
            assets-

      - name: Installer les dépendances
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Configurer les identifiants
        env:
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          CLIENT: ${{ secrets.GDRIVE_CLIENT_JSON }}
          TOKEN: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$GDRIVE_HOME" assets
          chmod 700 "$GDRIVE_HOME"
          if [ -n "${SA:-}" ]; then
            printf '%s' "$SA" > "$GDRIVE_HOME/service_account.json"
            echo "GDRIVE_MODE=service" >> "$GITHUB_ENV"
            echo "Mode : compte de service"
          elif [ -n "${TOKEN:-}" ] && [ -n "${CLIENT:-}" ]; then
            printf '%s' "$CLIENT" > "$GDRIVE_HOME/credentials.json"
            printf '%s' "$TOKEN" > "$GDRIVE_HOME/token.json"
            echo "GDRIVE_MODE=oauth" >> "$GITHUB_ENV"
            echo "Mode : OAuth refresh token"
          else
            echo "::error::Aucun secret Google Drive valide (GDRIVE_SERVICE_ACCOUNT_JSON, ou GDRIVE_CLIENT_JSON + GDRIVE_TOKEN_JSON)."
            exit 1
          fi
          chmod 600 "$GDRIVE_HOME"/*.json

      - name: Diagnostic de la connexion
        run: python bridge_sync.py --doctor

      - name: Miroir Drive
        run: python bridge_sync.py --sync

      - name: Vérifier que assets n'est pas vide
        run: |
          if [ -z "$(ls -A assets 2>/dev/null)" ]; then
            echo "::error::Le dossier assets est vide, synchronisation R2 annulée."
            exit 1
          fi

      - name: Installer rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: rclone sync ./assets r2:diegenasset --checksum --transfers 8 --stats-one-line -v

      - name: Sauvegarder le cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: assets
          key: assets-${{ github.run_id }}
